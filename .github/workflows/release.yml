name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write # create the GitHub release and upload installers
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04] # Start with Linux, they can add macos-latest and windows-latest later

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Python dependencies
        run: python3 -m pip install -r backend/requirements-desktop.txt

      - name: Install frontend dependencies
        run: npm install
        working-directory: ./frontend

      # Signs the update bundles and uploads latest.json, which installed apps poll through
      # releases/latest/download/latest.json. The key pair is ~/.tauri/ifrog.key(.pub); add the
      # private key and its password as repository secrets.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: "./frontend"
          tagName: v__VERSION__
          releaseName: "IFROG v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          # Published, not draft: the "latest release" URL the updater uses ignores drafts.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
